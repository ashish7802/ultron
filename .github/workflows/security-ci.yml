name: ULTRON Security & Regression CI

on:
  push:
    branches: [ main, "fix/*" ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Type Check & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npx tsc --noEmit

  security-regression:
    name: Security Invariants & Milestone Regression
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install pypiwin32 pywin32 cryptography comtypes
          python -c "import win32crypt, comtypes; print('pywin32 and comtypes imports verified in CI environment')"

      - name: Run Milestone 5 Security Suite
        run: npx tsx scripts/test_milestone5_battery.cjs

      - name: Run Milestone 5 Extended Suite
        run: npx tsx scripts/test_milestone5_extended.cjs

      - name: Run Phase 1 Security Battery (F-02, F-03, F-04, F-15)
        run: npx tsx scripts/test_phase1_battery.cjs

      - name: Run Phase 1.1 Adversarial Battery
        run: npx tsx scripts/test_phase1_1_adversarial.cjs

      - name: Run Predicate Security Suite
        run: npx tsx scripts/test_predicate_security.cjs

      - name: Run Phase 2 Security Hardening Battery
        run: npx tsx scripts/test_phase2_battery.cjs

      - name: Run Phase 2 Browser & API Workflow Battery
        run: npx tsx scripts/test_phase2_browser_workflows.cjs

      - name: Run Final Security Invariants & Custody Battery
        run: npx tsx scripts/test_final_security_invariants.cjs
